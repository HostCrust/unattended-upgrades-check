name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-24.04, not ubuntu-latest: actions/python-versions has no Python 3.9 build for newer images.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Collector is POSIX sh and passes ShellCheck
        run: |
          dash -n collect.sh
          shellcheck --shell=sh --severity=warning collect.sh
      - name: Package builds and the commands start
        run: |
          python -m pip install .
          uuc --version
          unattended-upgrades-check parse tests/fixtures/debian-12-healthy.txt
